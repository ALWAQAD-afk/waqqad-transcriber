<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>الوَرّاق</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0f1115);--card:var(--tg-theme-secondary-bg-color,#181b21);--text:var(--tg-theme-text-color,#f5f7fb);--hint:var(--tg-theme-hint-color,#9298a3);--link:var(--tg-theme-link-color,#58a6ff);--button:var(--tg-theme-button-color,#2481cc);--button-text:var(--tg-theme-button-text-color,#fff);--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:88px;min-height:100vh}.app{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:27px;font-weight:900}.sub,.meta{color:var(--hint);font-size:13px}.searchbox{width:100%;border:0;border-radius:16px;background:var(--card);color:var(--text);padding:14px 16px;outline:none;margin-bottom:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.folder,.file{background:var(--card);border-radius:18px}.stat{padding:15px}.stat b{font-size:25px;display:block}.section{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px}.section h2{font-size:17px;margin:0}.ghost{border:0;background:transparent;color:var(--link)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.folder{border:0;color:var(--text);padding:16px;text-align:right}.ico{font-size:28px;display:block;margin-bottom:8px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list{display:flex;flex-direction:column;gap:8px}.file{display:flex;align-items:center;gap:10px;padding:12px}.fileico{font-size:25px;width:34px;text-align:center}.filemain{min-width:0;flex:1}.filename{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.breadcrumbs,.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.crumb,.chip{border:0;border-radius:999px;background:var(--card);color:var(--text);padding:9px 12px;white-space:nowrap}.chip.active{background:var(--button);color:var(--button-text)}.empty{text-align:center;color:var(--hint);padding:42px 10px}.fab{position:fixed;left:18px;bottom:95px;width:56px;height:56px;border-radius:18px;border:0;background:var(--button);color:var(--button-text);font-size:28px}.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.nav{border:0;background:transparent;color:var(--hint);padding:7px 2px}.nav span{display:block;font-size:22px}.nav.active{color:var(--link)}.sheetwrap{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheetwrap.show{display:flex}.sheet{width:100%;max-height:78vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 24px}.action{width:100%;border:0;background:var(--card);color:var(--text);border-radius:14px;padding:13px;margin:5px 0;text-align:right}.primary{background:var(--button);color:var(--button-text);text-align:center;font-weight:800}.selectbar{position:fixed;left:14px;right:14px;bottom:88px;background:var(--card);padding:10px;border-radius:17px;display:none;gap:8px;z-index:15}.selectbar.show{display:flex}.selectbar button{flex:1;border:0;border-radius:12px;padding:11px;background:var(--button);color:var(--button-text)}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:99;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="toast" id="toast"></div><div class="app" id="app"></div>
<button class="fab" id="fab" onclick="newFolder()" style="display:none">＋</button>
<div class="selectbar" id="selectbar"><button onclick="chooseDestination()">نقل / حفظ في…</button><button onclick="clearSelection()">إلغاء</button></div>
<nav class="bar">
<button class="nav active" data-tab="home" onclick="goHome()"><span>🏠</span>الرئيسية</button>
<button class="nav" data-tab="inbox" onclick="goInbox()"><span>📥</span>الوارد</button>
<button class="nav" data-tab="files" onclick="openFolder(null)"><span>📁</span>الملفات</button>
<button class="nav" data-tab="search" onclick="goSearch()"><span>🔎</span>البحث</button>
</nav>
<div class="sheetwrap" id="sheetwrap" onclick="if(event.target.id==='sheetwrap')closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();
const API="/warraq/api",initData=tg.initData||"";let state={tab:"home",folderId:null,selected:new Set(),selectionMode:null,searchKind:"all"};
const H=()=>({"Content-Type":"application/json","X-Telegram-Init-Data":initData});
async function api(p,o={}){let r=await fetch(API+p,{...o,headers:H()}),d={};try{d=await r.json()}catch(_){}if(!r.ok||d.ok===false)throw new Error(d.error||"حدث خطأ");return d}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(m){let e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2000)}
function setTab(n){state.tab=n;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.tab===n))}
function icon(k){return({image:"🖼️",audio:"🎧",video:"🎬",pdf:"📕",text:"📝",archive:"📦",document:"📄"})[k]||"📄"}
function card(f,s=false){let ch=state.selected.has(f.id)?"checked":"";return `<div class="file" onclick="${s?`toggle(${f.id})`:`menu(${f.id},${JSON.stringify(f.name)},${JSON.stringify(f.path||"")})`}">${s?`<input type=checkbox ${ch} onclick="event.stopPropagation();toggle(${f.id})">`:""}<div class=fileico>${icon(f.kind)}</div><div class=filemain><div class=filename>${esc(f.name)}</div><div class=meta>${esc(f.size_human)}${f.path?` · 📁 ${esc(f.path)}`:""}</div></div></div>`}
function sync(){document.getElementById("selectbar").classList.toggle("show",state.selected.size>0)}
async function goHome(){setTab("home");state.selected.clear();sync();fab.style.display="none";app.innerHTML='<div class=empty>جاري التحميل…</div>';try{let d=await api("/bootstrap");app.innerHTML=`<div class=top><div><div class=brand>الوَرّاق 📚</div><div class=sub>مكتبتك داخل تيليجرام</div></div></div><input class=searchbox placeholder="ابحث في مكتبتك…" onclick="goSearch()"><div class=stats><div class=stat onclick="goInbox()"><b>${d.inbox_count}</b><span>في الوارد</span></div><div class=stat onclick="openFolder(null)"><b>${d.total_files}</b><span>ملف محفوظ</span></div></div><div class=section><h2>المجلدات</h2><button class=ghost onclick="openFolder(null)">عرض الكل</button></div><div class=grid>${d.folders.slice(0,6).map(f=>`<button class=folder onclick="openFolder(${f.id})"><span class=ico>${f.icon||"📁"}</span><div class=name>${esc(f.name)}</div></button>`).join("")}</div><div class=section><h2>الأخيرة</h2></div><div class=list>${d.recent.length?d.recent.map(f=>card(f)).join(""):'<div class=empty>لا توجد ملفات بعد.</div>'}</div>`}catch(e){app.innerHTML=`<div class=empty><h2>افتح الوَرّاق من داخل Telegram</h2><p>${esc(e.message)}</p></div>`}}
async function openFolder(id){setTab("files");state.folderId=id;state.selectionMode="saved";state.selected.clear();sync();fab.style.display="block";app.innerHTML='<div class=empty>جاري الفتح…</div>';try{let d=await api("/folder?id="+(id??"root")),c=[{id:null,name:"ملفاتي"},...(d.breadcrumb||[])];app.innerHTML=`<div class=top><div><div class=brand>📁 الملفات</div></div></div><div class=breadcrumbs>${c.map(x=>`<button class=crumb onclick="openFolder(${x.id===null?"null":x.id})">${esc(x.name)}</button>`).join("")}</div><div class=grid>${d.children.map(f=>`<button class=folder onclick="openFolder(${f.id})"><span class=ico>${f.icon||"📁"}</span><div class=name>${esc(f.name)}</div></button>`).join("")}</div><div class=section><h2>الملفات</h2></div><div class=list>${d.files.length?d.files.map(f=>card(f)).join(""):'<div class=empty>المجلد فارغ.</div>'}</div>`}catch(e){toast(e.message)}}
async function goInbox(){setTab("inbox");state.selectionMode="pending";state.selected.clear();sync();fab.style.display="none";try{let d=await api("/inbox");app.innerHTML=`<div class=top><div><div class=brand>📥 الوارد</div><div class=sub>حدد عدة ملفات وانقلها دفعة واحدة</div></div></div><div class=list>${d.files.length?d.files.map(f=>card(f,true)).join(""):'<div class=empty>الوارد فارغ ✨</div>'}</div>`}catch(e){toast(e.message)}}
function toggle(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);sync();goInboxKeep()}
async function goInboxKeep(){let d=await api("/inbox");app.innerHTML=`<div class=top><div><div class=brand>📥 الوارد</div><div class=sub>تم تحديد ${state.selected.size}</div></div></div><div class=list>${d.files.map(f=>card(f,true)).join("")}</div>`}
function clearSelection(){state.selected.clear();sync();state.tab==="inbox"?goInbox():openFolder(state.folderId)}
async function goSearch(){setTab("search");fab.style.display="none";app.innerHTML=`<div class=top><div><div class=brand>🔎 البحث</div></div></div><input id=q class=searchbox placeholder="اسم الملف…" oninput="runSearch()"><div class=filters>${[["all","الكل"],["pdf","PDF"],["image","صور"],["text","نصوص"],["audio","صوت"],["video","فيديو"],["archive","أرشيف"]].map(([k,t])=>`<button class="chip ${k==="all"?"active":""}" onclick="kind('${k}',this)">${t}</button>`).join("")}</div><div class=list id=results><div class=empty>ابحث بالاسم أو النوع.</div></div>`}
function kind(k,e){state.searchKind=k;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));e.classList.add("active");runSearch()}
let timer;function runSearch(){clearTimeout(timer);timer=setTimeout(async()=>{let q=document.getElementById("q")?.value||"",d=await api(`/search?q=${encodeURIComponent(q)}&kind=${state.searchKind}`);results.innerHTML=d.files.length?d.files.map(f=>card(f)).join(""):'<div class=empty>لا نتائج.</div>'},200)}
function openSheet(h){sheet.innerHTML=h;sheetwrap.classList.add("show")}function closeSheet(){sheetwrap.classList.remove("show")}
function menu(id,n,p){openSheet(`<h3>${esc(n)}</h3><div class=sub>${p?`📁 ${esc(p)}`:""}</div><button class=action onclick="retrieve(${id})">📤 إرسال إلى المحادثة</button><button class=action onclick="moveOne(${id})">📁 نقل…</button><button class=action onclick="closeSheet()">إلغاء</button>`)}
async function retrieve(id){await api("/files/retrieve",{method:"POST",body:JSON.stringify({file_id:id})});closeSheet();toast("أرسلته لك ✅")}
function moveOne(id){closeSheet();state.selected=new Set([id]);state.selectionMode="saved";sync();chooseDestination()}
async function newFolder(){let n=prompt("اسم المجلد الجديد:");if(!n)return;try{await api("/folders",{method:"POST",body:JSON.stringify({name:n,parent_id:state.folderId})});toast("تم إنشاء المجلد ✅");openFolder(state.folderId)}catch(e){toast(e.message)}}
async function chooseDestination(){let d=await api("/folder?id=root");openSheet(`<h3>📁 اختر المجلد</h3><button class="action primary" onclick="finishDest(null)">ملفاتي</button>${d.children.map(f=>`<button class=action onclick="dest(${f.id},${JSON.stringify(f.name)})">${f.icon||"📁"} ${esc(f.name)}</button>`).join("")}<button class=action onclick="closeSheet()">إلغاء</button>`)}
async function dest(id,n){let d=await api("/folder?id="+id);openSheet(`<h3>📁 ${esc(n)}</h3><button class="action primary" onclick="finishDest(${id})">✅ اختيار هذا المجلد</button>${d.children.map(f=>`<button class=action onclick="dest(${f.id},${JSON.stringify(f.name)})">${f.icon||"📁"} ${esc(f.name)}</button>`).join("")}<button class=action onclick="chooseDestination()">↩️ الجذر</button>`)}
async function finishDest(fid){let ids=[...state.selected];try{if(state.selectionMode==="pending"){let d=await api("/pending/save",{method:"POST",body:JSON.stringify({file_ids:ids,folder_id:fid})});toast(d.failed?.length?`حُفظ ${d.saved.length} وفشل ${d.failed.length}`:`حُفظ ${d.saved.length} ملف ✅`)}else{let d=await api("/files/move",{method:"POST",body:JSON.stringify({file_ids:ids,folder_id:fid})});toast(`نُقل ${d.moved} ملف ✅`)}closeSheet();clearSelection()}catch(e){toast(e.message)}}
goHome();
</script>
</body></html>
