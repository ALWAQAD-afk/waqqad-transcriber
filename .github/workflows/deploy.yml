name: Deploy to Modal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: modal deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "modal>=1.0,<2.0"

      - name: Verify Python syntax
        run: |
          python -m compileall -q app.py modal_app.py warraq.py warraq_miniapp.py \
            refine.py job_queue.py transcripts.py url_media.py exporters.py \
            bot_upload.py diagnostics.py db.py

      - name: Check Modal credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets are required."
            exit 1
          fi

      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_SECRET_NAMES: ${{ vars.MODAL_SECRET_NAMES || 'waqqad-transcriber-env' }}
          MODAL_APP_NAME: ${{ vars.MODAL_APP_NAME || 'waqqad-transcriber' }}
        run: |
          modal deploy modal_app.py
