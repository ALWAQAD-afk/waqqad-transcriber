name: docker-build-check

on:
  push:
    branches: [ci/docker-check-2026-11-08]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: waqqad-transcriber:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
