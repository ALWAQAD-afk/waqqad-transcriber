name: docker-build-check

on:
  push:
    branches: [ci/docker-check-2026-11-08]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: waqqad-transcriber:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check PO token provider is installed
        run: |
          docker run --rm --entrypoint /bin/sh waqqad-transcriber:check -c \
            'deno --version && python -c "import url_media; print(url_media.pot_provider_state())"'

      - name: Probe YouTube with PO token
        timeout-minutes: 10
        run: |
          docker run --rm --entrypoint /bin/sh waqqad-transcriber:check -c \
            'yt-dlp -v --skip-download --no-warnings \
              --extractor-args "youtubepot-bgutilscript:server_home=/opt/bgutil/server" \
              --extractor-args "youtube:player_client=web;formats=missing_pot" \
              "https://www.youtube.com/watch?v=YKLXKyhUmMs" 2>&1 | tail -80'

      - name: Probe YouTube with forced PO token
        timeout-minutes: 15
        run: |
          docker run --rm --entrypoint /bin/sh waqqad-transcriber:check -c \
            'yt-dlp -v --skip-download --no-warnings \
              --extractor-args "youtubepot-bgutilscript:server_home=/opt/bgutil/server" \
              --extractor-args "youtube:player_client=mweb;formats=missing_pot;fetch_pot=always;pot_trace=true;player_skip=webpage" \
              "https://www.youtube.com/watch?v=YKLXKyhUmMs" 2>&1 | tail -120'

      - name: Inspect formats through our own code path
        timeout-minutes: 15
        run: |
          docker run --rm --entrypoint /bin/sh waqqad-transcriber:check -c \
            'python - <<"PY"
import tempfile
from pathlib import Path
import url_media

url = "https://www.youtube.com/watch?v=YKLXKyhUmMs"
with tempfile.TemporaryDirectory() as temp:
    for clients in (("mweb",), ("web",), ("web_safari",)):
        label = "+".join(clients)
        info, error = url_media.inspect_youtube(
            url, Path(temp), clients=clients, pot=True, force_pot=True
        )
        print("===", label, "error:", error)
        for fmt in (info or {}).get("formats") or []:
            print(fmt.get("format_id"), fmt.get("ext"), fmt.get("acodec"), fmt.get("vcodec"), fmt.get("protocol"))
PY'
