name: docker-build-check

on:
  push:
    branches: [ci/docker-check-2026-11-08]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: waqqad-transcriber:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check PO token provider is installed
        run: |
          docker run --rm --entrypoint /bin/sh waqqad-transcriber:check -c \
            'deno --version && python -c "import url_media; print(url_media.pot_provider_state())"'

      - name: Probe YouTube with PO token
        timeout-minutes: 10
        run: |
          docker run --rm --entrypoint /bin/sh waqqad-transcriber:check -c \
            'yt-dlp -v --skip-download --no-warnings \
              --extractor-args "youtubepot-bgutilscript:server_home=/opt/bgutil/server" \
              --extractor-args "youtube:player_client=web;formats=missing_pot" \
              "https://www.youtube.com/watch?v=YKLXKyhUmMs" 2>&1 | tail -80'

      - name: Probe YouTube with forced PO token
        timeout-minutes: 15
        run: |
          docker run --rm --entrypoint /bin/sh waqqad-transcriber:check -c \
            'yt-dlp -v --skip-download --no-warnings \
              --extractor-args "youtubepot-bgutilscript:server_home=/opt/bgutil/server" \
              --extractor-args "youtube:player_client=mweb;formats=missing_pot;fetch_pot=always;pot_trace=true" \
              "https://www.youtube.com/watch?v=YKLXKyhUmMs" 2>&1 | tail -120'

      - name: Probe YouTube through Cloudflare WARP
        timeout-minutes: 15
        run: |
          set -x
          curl -fsSL -o /tmp/warp-plus.zip \
            https://github.com/bepass-org/warp-plus/releases/download/v1.2.6/warp-plus_linux-amd64.zip
          mkdir -p /tmp/warp-plus && unzip -o /tmp/warp-plus.zip -d /tmp/warp-plus
          chmod +x /tmp/warp-plus/warp-plus
          nohup /tmp/warp-plus/warp-plus -b 127.0.0.1:8086 -v > /tmp/warp-plus.log 2>&1 &
          sleep 12
          tail -30 /tmp/warp-plus.log
          curl -s --max-time 20 --socks5-hostname 127.0.0.1:8086 https://www.cloudflare.com/cdn-cgi/trace || true
          docker run --rm --network host --entrypoint /bin/sh waqqad-transcriber:check -c \
            'yt-dlp -v --skip-download --no-warnings --proxy socks5://127.0.0.1:8086 \
              "https://www.youtube.com/watch?v=YKLXKyhUmMs" 2>&1 | tail -100'
